<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกการเข้าใช้ห้องคอมพิวเตอร์โรงเรียนบ้านภูพระโนนผักหวาน</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #ec4899;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass: rgba(255, 255, 255, 0.97); /* เพิ่มความทึบแสงนิดหน่อยเพื่อให้อ่านง่าย */
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: var(--bg-gradient);
            height: 100vh; /* เต็มความสูงจอ */
            margin: 0;
            padding: 0; /* เอา padding ออกเพื่อให้เต็มจอจริง */
            overflow: hidden; /* ซ่อน scrollbar */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard {
            background: var(--glass);
            width: 100vw;  /* เต็มความกว้าง */
            height: 100vh; /* เต็มความสูง */
            max-width: none; /* ยกเลิกการจำกัดความกว้าง */
            border-radius: 0; /* เอามุมโค้งออก */
            box-shadow: none;
            display: grid;
            grid-template-columns: 1fr 1fr; /* แบ่งครึ่งซ้ายขวาเท่ากัน */
            overflow: hidden;
        }

        /* --- ฝั่งซ้าย: Input --- */
        .input-section {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center; /* จัดให้อยู่กึ่งกลางแนวตั้ง */
            align-items: center;
            border-right: 1px solid #eee;
            position: relative;
            text-align: center;
        }

        /* ชื่อโรงเรียน */
        .school-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 30px;
            line-height: 1.3;
        }

        .clock-widget {
            text-align: center;
            margin-bottom: 30px;
        }
        .time { font-size: 3.5rem; font-weight: 600; color: #333; line-height: 1; }
        .date { font-size: 1.1rem; color: #666; margin-top: 10px; }

        .input-box { width: 70%; position: relative; margin-bottom: 20px; }
        input[type="number"] {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.8rem;
            border: 3px solid #ddd;
            border-radius: 50px;
            text-align: center;
            font-family: 'Prompt', sans-serif;
            transition: all 0.3s;
            outline: none;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            box-sizing: border-box; 
        }
        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 5px rgba(79, 70, 229, 0.2);
        }

        /* ปุ่มกดที่เพิ่มกลับมา */
        .btn-checkin {
            width: 70%;
            padding: 15px;
            background: var(--primary);
            /* หรือใช้ Gradient: background: linear-gradient(to right, var(--primary), var(--secondary)); */
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.3rem;
            font-family: 'Prompt', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }
        .btn-checkin:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }
        .btn-checkin:active {
            transform: translateY(1px);
        }
        
        .status-text {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #888;
        }

        /* --- ฝั่งขวา: Log --- */
        .history-section {
            padding: 40px;
            background: #f9fafb;
            display: flex;
            flex-direction: column;
            border-left: 2px solid rgba(0,0,0,0.05); /* เพิ่มเส้นคั่นให้ชัดขึ้น */
        }
        
        .history-header {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }
        
        .badge {
            background: var(--secondary);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 1rem;
            box-shadow: 0 4px 6px rgba(236, 72, 153, 0.3);
        }

        .log-list {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        .log-item {
            background: white;
            padding: 15px 20px;
            border-radius: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid #f0f0f0;
            transition: transform 0.2s;
            animation: slideIn 0.3s ease-out;
            border-left: 6px solid var(--primary);
        }
        .log-item:hover { transform: translateX(5px); }
        
        .avatar {
            width: 50px;
            height: 50px;
            background: #e0e7ff;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3rem;
            margin-right: 15px;
        }

        .log-info h4 { margin: 0; font-size: 1.2rem; color: #333; }
        .log-info p { margin: 0; font-size: 0.9rem; color: #888; }
        .log-time { margin-left: auto; font-size: 1rem; font-weight: bold; color: var(--primary); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        @keyframes slideIn { 0% { opacity: 0; transform: translateX(20px); } 100% { opacity: 1; transform: translateX(0); } }

        /* Responsive */
        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
            .input-section { padding: 30px; height: auto; min-height: 50%; border-right: none; border-bottom: 1px solid #eee; }
            .history-section { height: auto; min-height: 50%; }
            .school-title { font-size: 1.5rem; }
            .time { font-size: 3rem; }
            .input-box, .btn-checkin { width: 90%; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="input-section">
            <h1 class="school-title">ระบบบันทึกการเข้าใช้ห้องคอมพิวเตอร์<br>โรงเรียนบ้านภูพระโนนผักหวาน</h1>

            <div class="clock-widget">
                <div class="time" id="clockTime">00:00</div>
                <div class="date" id="clockDate">กำลังเชื่อมต่อฐานข้อมูล...</div>
            </div>

            <div class="input-box">
                <input type="number" id="studentId" placeholder="สแกนรหัส หรือ กรอกตัวเลข" disabled>
            </div>
            
            <button class="btn-checkin" id="checkinBtn" onclick="checkIn()" disabled>✅ ลงชื่อเข้าใช้</button>

            <div class="status-text" id="statusText">พร้อมใช้งาน (รองรับการสแกน)</div>
        </div>

        <div class="history-section">
            <div class="history-header">
                <div>📚 ประวัติการเข้าใช้งานล่าสุด</div>
                <span class="badge" id="countBadge">0 คน</span>
            </div>
            <div class="log-list" id="logList">
                <div style="text-align: center; color: #ccc; margin-top: 50px; font-weight: 300; font-size: 1.2rem;" id="emptyMsg">
                    ยังไม่มีข้อมูลวันนี้
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🔧 ตั้งค่า: ใส่ URL Web App ของคุณที่นี่
        // ==========================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbydMIwaHtPZCn9X10ZdOsP-NZpEvNuaNbCh6r3hoxbZvoPHN5avFv_CbrVDcV7ZOh1L/exec'; 

        // ตัวแปรระบบ
        let studentDatabase = {};
        let isDatabaseLoaded = false;
        let checkedInList = []; 
        let studentCount = 0;

        // เริ่มทำงานเมื่อเปิดเว็บ
        document.addEventListener('DOMContentLoaded', () => {
            updateClock();
            setInterval(updateClock, 1000);
            loadStudentData(); // ดึงรายชื่อจาก Sheet
        });

        // ฟังก์ชันดึงรายชื่อ (GET)
        function loadStudentData() {
            const dateEl = document.getElementById('clockDate');
            dateEl.innerText = "⏳ กำลังดึงรายชื่อ...";
            dateEl.style.color = "#f59e0b";

            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    studentDatabase = data;
                    isDatabaseLoaded = true;
                    
                    // ปลดล็อคหน้าจอ และปุ่มกด
                    document.getElementById('studentId').removeAttribute('disabled');
                    document.getElementById('checkinBtn').removeAttribute('disabled'); // ปลดล็อคปุ่ม
                    document.getElementById('studentId').focus();
                    document.getElementById('statusText').innerText = `โหลดรายชื่อเสร็จสิ้น (${Object.keys(data).length} คน)`;
                    
                    updateClock(); 
                    
                    Swal.fire({
                        toast: true, position: 'top-end', icon: 'success',
                        title: 'ระบบพร้อมใช้งาน', showConfirmButton: false, timer: 2000
                    });
                })
                .catch(err => {
                    console.error(err);
                    dateEl.innerText = "❌ เชื่อมต่อไม่ได้";
                    dateEl.style.color = "red";
                    document.getElementById('statusText').innerText = "โปรดตรวจสอบอินเทอร์เน็ตแล้วรีเฟรช";
                });
        }

        // นาฬิกา
        function updateClock() {
            const now = new Date();
            document.getElementById('clockTime').innerText = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
            if (isDatabaseLoaded) {
                const dateEl = document.getElementById('clockDate');
                dateEl.innerText = now.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                dateEl.style.color = "#666";
            }
        }

        // ตรวจจับปุ่ม Enter
        const inputField = document.getElementById("studentId");
        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") checkIn();
        });

        // ★ ระบบ Focus Lock: คลิกที่ว่างให้เด้งกลับมาช่องกรอก 
        // (ปรับปรุงให้ไม่กระทบกับการกดปุ่มที่เพิ่มมาใหม่)
        document.addEventListener('click', function(e) {
            // ถ้าโหลดเสร็จแล้ว และสิ่งที่คลิกไม่ใช่ปุ่ม (BUTTON)
            if (isDatabaseLoaded && e.target.tagName !== 'BUTTON') {
                inputField.focus();
            }
        });

        // ฟังก์ชันเช็คชื่อหลัก
        function checkIn() {
            if (!isDatabaseLoaded) return;
            const id = inputField.value.trim();
            if (!id) {
                 inputField.focus(); // ถ้าไม่กรอกอะไร ให้โฟกัสกลับไป
                 return;
            }

            // 1. เช็คซ้ำ
            if (checkedInList.includes(id)) {
                playSound('error');
                Swal.fire({
                    icon: 'warning', title: 'ซ้ำครับ!', text: 'รหัสนี้บันทึกไปแล้ว',
                    timer: 1500, showConfirmButton: false, backdrop: `rgba(0,0,0,0.1)`
                });
                inputField.value = '';
                return;
            }

            // 2. ตรวจสอบรายชื่อ
            const name = studentDatabase[id];
            
            if (!name) {
                playSound('error');
                Swal.fire({
                    icon: 'error', title: 'ไม่พบข้อมูล', text: 'รหัสนักเรียนไม่ถูกต้อง',
                    timer: 1500, showConfirmButton: false
                });
                inputField.value = '';
                return;
            }

            // 3. ผ่าน: บันทึกผล
            playSound('success');
            
            const Toast = Swal.mixin({
                toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true
            });
            Toast.fire({ icon: 'success', title: `ยินดีต้อนรับ!\n${name}` });

            addLogCard(id, name);
            sendToSheet(id, name);

            checkedInList.push(id);
            inputField.value = '';
            inputField.focus(); // โฟกัสกลับไปเตรียมพร้อม
        }

        // สร้างการ์ดแสดงผล
        function addLogCard(id, name) {
            document.getElementById('emptyMsg').style.display = 'none';
            const list = document.getElementById('logList');
            const time = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
            
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerHTML = `
                <div class="avatar">${id.substr(-2)}</div>
                <div class="log-info">
                    <h4>${name}</h4>
                    <p>ID: ${id}</p>
                </div>
                <div class="log-time">${time}</div>
            `;
            
            list.insertBefore(div, list.firstChild);
            
            studentCount++;
            document.getElementById('countBadge').innerText = `${studentCount} คน`;
        }

        // ส่งข้อมูล (POST)
        function sendToSheet(id, name) {
            const formData = new FormData();
            formData.append('id', id);
            formData.append('name', name);
            fetch(SCRIPT_URL, { method: 'POST', body: formData, mode: 'no-cors' })
                .catch(err => console.error(err));
        }

        // ระบบเสียง (Web Audio API)
        function playSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                if (type === 'success') {
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else { // error
                    osc.type = 'sawtooth';
                    osc.frequency.value = 150;
                    gain.gain.value = 0.1;
                    osc.start();
                    setTimeout(() => osc.stop(), 200);
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
